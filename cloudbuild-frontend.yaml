steps:
  # Build the frontend Docker image with the backend URL
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build', '--build-arg',
        'VITE_API_URL=${_BACKEND_URL}',
        '-t', 'gcr.io/$PROJECT_ID/gymtrack-frontend',
        './frontend'
      ]

  # Push the image to the registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gymtrack-frontend']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run', 'deploy', 'gymtrack-frontend',
        '--image', 'gcr.io/$PROJECT_ID/gymtrack-frontend',
        '--platform', 'managed',
        '--region', 'us-central1',
        '--allow-unauthenticated',
        '--port', '80'
      ]

substitutions:
  _BACKEND_URL: 'https://gymtrack-backend-157757292541.us-central1.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
